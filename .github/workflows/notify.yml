name: Tägliche ntfy-Benachrichtigung

on:
  schedule:
    # GitHub startet Cron-Jobs zwischen pünktlich und ~100 Minuten zu spät, und
    # gelegentlich gar nicht (kein Runner frei – dann läuft kein einziger Step,
    # ein Retry im Workflow ist also unmöglich). Deshalb mehrere Slots je Fenster
    # statt einem: der erste, der einen Runner bekommt und im Berliner Zeitfenster
    # landet, sendet. Alle weiteren prallen an mint.pushes ab und schweigen.
    # Die Stunden decken Sommer- (UTC+2) und Winterzeit (UTC+1) gemeinsam ab;
    # was außerhalb des Fensters landet, steigt sofort wieder aus.
    - cron: "0 5 * * *" # morgens, Fenster 7–10 Berlin
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 17 * * *" # abends, Fenster 19–22 Berlin
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Welche Nachricht senden?"
        required: true
        default: "morgen"
        type: choice
        options: [morgen, abend]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Bewusst vor checkout und npm ci: die Mehrzahl der Läufe fällt aus dem
      # Fenster und soll dann Sekunden statt Minuten kosten. Das Repo ist privat,
      # Actions-Minuten sind kontingentiert.
      - name: Modus und Zeitfenster bestimmen
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "force=--force" >> "$GITHUB_OUTPUT"
            echo "run=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=Europe/Berlin date +%-H)
          if   [ "$HOUR" -ge  7 ] && [ "$HOUR" -le 10 ]; then MODE=morgen
          elif [ "$HOUR" -ge 19 ] && [ "$HOUR" -le 22 ]; then MODE=abend
          else
            echo "Berlin-Stunde $HOUR liegt in keinem Fenster (7–10 / 19–22) – Ende."
            echo "run=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Berlin-Stunde $HOUR → Modus $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "force=" >> "$GITHUB_OUTPUT"
          echo "run=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.mode.outputs.run == 'yes'
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.run == 'yes'
        with:
          node-version: "22"
          cache: npm
      # notify.mjs liest den Themen-Status über lib/db.js (braucht pg).
      - name: Dependencies installieren
        if: steps.mode.outputs.run == 'yes'
        run: npm ci --omit=dev
      - name: Nachricht senden
        if: steps.mode.outputs.run == 'yes'
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          APP_URL: ${{ vars.APP_URL }}
          MINT_DB_URL_JOB: ${{ secrets.MINT_DB_URL_JOB }}
        run: node scripts/notify.mjs ${{ steps.mode.outputs.mode }} ${{ steps.mode.outputs.force }}
