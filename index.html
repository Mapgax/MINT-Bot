<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1b22" media="(prefers-color-scheme: dark)">
  <title>MINT-Bot – Dein Forscher-Tag</title>

<body>

    <button class="tab" data-tab="geschafft"><span class="tab-icon">🏅</span><span>Geschafft</span></button>
  </nav>

  <div id="confetti-layer" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
